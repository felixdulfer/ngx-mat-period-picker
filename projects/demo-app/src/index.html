<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ngx-mat-period-picker — Live Demo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Live demo and playground for ngx-mat-period-picker — an Angular Material 3 period picker component." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Anti-FOUC: apply saved theme before first paint -->
    <script>
      (function () {
        var mode = localStorage.getItem('ngx-mat-period-picker-theme-mode') || 'system';
        var scheme = mode === 'system' ? 'light dark' : mode;
        document.documentElement.style.colorScheme = scheme;
      })();
    </script>

    <!-- Fonts: Roboto Flex (variable) + Roboto Mono for code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
